<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperSubmit AI - 论文自动投稿系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-button {
            flex: 1;
            padding: 15px;
            background: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .tab-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .tab-button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .file-upload {
            border: 3px dashed #667eea;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }

        .file-upload:hover {
            background: #eef0ff;
            border-color: #764ba2;
        }

        .file-upload input {
            display: none;
        }

        .btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .journal-card {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
            transition: all 0.3s;
        }

        .journal-card:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .journal-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .journal-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .info-item strong {
            color: #666;
        }

        .submission-card {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .submission-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-submitted {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-under_review {
            background: #d4edda;
            color: #155724;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🚀 PaperSubmit AI</h1>
            <p>智能论文投稿系统 - 让学术发表更简单</p>
        </div>

        <!-- 标签页 -->
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('upload')">📤 上传论文</button>
            <button class="tab-button" onclick="switchTab('dashboard')">📊 投稿仪表盘</button>
            <button class="tab-button" onclick="switchTab('search')">🔍 期刊搜索</button>
        </div>

        <!-- 上传论文页面 -->
        <div id="upload-tab" class="tab-content active">
            <h2 style="margin-bottom: 20px; color: #667eea;">上传论文并获取期刊推荐</h2>
            
            <div id="upload-message"></div>

            <form id="upload-form">
                <div class="form-group">
                    <label>📄 论文PDF文件 *</label>
                    <div class="file-upload" onclick="document.getElementById('file-input').click()">
                        <p style="font-size: 1.2em; margin-bottom: 10px;">📁 点击选择PDF文件</p>
                        <p style="color: #999;">或拖拽文件到此处</p>
                        <input type="file" id="file-input" accept=".pdf" required>
                        <p id="file-name" style="margin-top: 10px; color: #667eea; font-weight: bold;"></p>
                    </div>
                </div>

                <div class="form-group">
                    <label>📝 论文标题 *</label>
                    <input type="text" id="title" placeholder="请输入论文标题" required>
                </div>

                <div class="form-group">
                    <label>👥 作者（逗号分隔）*</label>
                    <input type="text" id="authors" placeholder="例如: 张三, 李四, 王五" required>
                </div>

                <div class="form-group">
                    <label>📋 摘要 *</label>
                    <textarea id="abstract" placeholder="请输入论文摘要..." required></textarea>
                </div>

                <button type="submit" class="btn" id="upload-btn">
                    🚀 上传并获取期刊推荐
                </button>
            </form>

            <!-- 推荐结果 -->
            <div id="recommendations" style="margin-top: 40px; display: none;">
                <h2 style="margin-bottom: 20px; color: #667eea;">📊 推荐期刊</h2>
                <div id="keywords-display" style="margin-bottom: 20px; padding: 15px; background: #f8f9ff; border-radius: 8px;">
                    <strong>🔑 提取的关键词：</strong>
                    <span id="keywords"></span>
                </div>
                <div id="journal-list"></div>
            </div>
        </div>

        <!-- 投稿仪表盘 -->
        <div id="dashboard-tab" class="tab-content">
            <h2 style="margin-bottom: 20px; color: #667eea;">📊 投稿仪表盘</h2>
            
            <!-- 统计卡片 -->
            <div id="stats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
                <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px; text-align: center;">
                    <h3 style="font-size: 2em; margin-bottom: 5px;" id="total-count">0</h3>
                    <p>总投稿数</p>
                </div>
                <div style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 20px; border-radius: 10px; text-align: center;">
                    <h3 style="font-size: 2em; margin-bottom: 5px;" id="pending-count">0</h3>
                    <p>待处理</p>
                </div>
                <div style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; padding: 20px; border-radius: 10px; text-align: center;">
                    <h3 style="font-size: 2em; margin-bottom: 5px;" id="submitted-count">0</h3>
                    <p>已提交</p>
                </div>
                <div style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: white; padding: 20px; border-radius: 10px; text-align: center;">
                    <h3 style="font-size: 2em; margin-bottom: 5px;" id="paper-count">0</h3>
                    <p>论文总数</p>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div style="margin-bottom: 20px; display: flex; gap: 10px;">
                <button onclick="exportData('papers')" class="btn" style="padding: 10px 20px; font-size: 0.9em;">
                    📥 导出论文数据
                </button>
                <button onclick="exportData('submissions')" class="btn" style="padding: 10px 20px; font-size: 0.9em;">
                    📥 导出投稿数据
                </button>
                <button onclick="exportData('all')" class="btn" style="padding: 10px 20px; font-size: 0.9em;">
                    📥 导出所有数据
                </button>
                <button onclick="loadStatistics()" class="btn" style="padding: 10px 20px; font-size: 0.9em; background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
                    📊 查看详细统计
                </button>
            </div>

            <div id="submissions-list"></div>
            
            <!-- 详细统计 -->
            <div id="detailed-stats" style="display: none; margin-top: 30px; padding: 20px; background: #f8f9ff; border-radius: 10px;">
                <h3 style="color: #667eea; margin-bottom: 15px;">📈 详细统计</h3>
                <div id="stats-content"></div>
            </div>
        </div>

        <!-- 期刊搜索 -->
        <div id="search-tab" class="tab-content">
            <h2 style="margin-bottom: 20px; color: #667eea;">🔍 期刊搜索</h2>
            
            <div class="form-group">
                <input type="text" id="search-input" placeholder="输入关键词搜索期刊..." style="font-size: 1.1em;">
            </div>

            <button onclick="searchJournals()" class="btn">搜索</button>

            <div id="search-results" style="margin-top: 30px;"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let currentPaperId = null;

        // 切换标签页
        function switchTab(tabName) {
            // 隐藏所有标签内容
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // 显示选中的标签
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');

            // 加载对应数据
            if (tabName === 'dashboard') {
                loadDashboard();
            }
        }

        // 文件选择
        document.getElementById('file-input').addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name;
            if (fileName) {
                document.getElementById('file-name').textContent = '已选择: ' + fileName;
            }
        });

        // 上传论文表单
        document.getElementById('upload-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('upload-btn');
            btn.disabled = true;
            btn.textContent = '⏳ 上传中...';

            const formData = new FormData();
            formData.append('file', document.getElementById('file-input').files[0]);
            formData.append('title', document.getElementById('title').value);
            formData.append('authors', document.getElementById('authors').value);
            formData.append('abstract', document.getElementById('abstract').value);

            try {
                // 上传论文
                const uploadRes = await fetch(`${API_BASE}/api/papers/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!uploadRes.ok) throw new Error('上传失败');

                const uploadData = await uploadRes.json();
                currentPaperId = uploadData.paper_id;

                showMessage('success', '✅ 论文上传成功！正在获取期刊推荐...');

                // 获取期刊推荐
                btn.textContent = '🔍 推荐期刊中...';
                
                const recRes = await fetch(`${API_BASE}/api/journals/recommend?paper_id=${currentPaperId}&top_k=5`, {
                    method: 'POST'
                });

                if (!recRes.ok) throw new Error('推荐失败');

                const recData = await recRes.json();
                displayRecommendations(recData);

                btn.textContent = '✅ 完成';
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = '🚀 上传并获取期刊推荐';
                }, 2000);

            } catch (error) {
                showMessage('error', '❌ 操作失败: ' + error.message);
                btn.disabled = false;
                btn.textContent = '🚀 上传并获取期刊推荐';
            }
        });

        // 显示推荐结果
        function displayRecommendations(data) {
            const recsDiv = document.getElementById('recommendations');
            const keywordsSpan = document.getElementById('keywords');
            const journalList = document.getElementById('journal-list');

            // 显示关键词
            keywordsSpan.textContent = data.keywords.slice(0, 10).join(', ');

            // 显示期刊列表
            journalList.innerHTML = data.recommendations.map((rec, index) => `
                <div class="journal-card">
                    <h3>${index + 1}. ${rec.journal}</h3>
                    <div class="journal-info">
                        <div class="info-item">
                            <strong>综合评分:</strong> ${(rec.score * 100).toFixed(1)}%
                        </div>
                        <div class="info-item">
                            <strong>匹配度:</strong> ${(rec.match_score * 100).toFixed(1)}%
                        </div>
                        <div class="info-item">
                            <strong>影响因子:</strong> ${rec.impact_factor}
                        </div>
                        <div class="info-item">
                            <strong>审稿时间:</strong> ${rec.review_time_days} 天
                        </div>
                        <div class="info-item">
                            <strong>接收率:</strong> ${(rec.acceptance_rate * 100).toFixed(1)}%
                        </div>
                        <div class="info-item">
                            <strong>投稿系统:</strong> ${rec.submission_system}
                        </div>
                    </div>
                    <button class="btn" style="margin-top: 15px; padding: 10px 20px; font-size: 0.9em;" 
                            onclick="createSubmission(${currentPaperId}, '${rec.journal}')">
                        📤 投稿到此期刊
                    </button>
                </div>
            `).join('');

            recsDiv.style.display = 'block';
            recsDiv.scrollIntoView({ behavior: 'smooth' });
        }

        // 创建投稿
        async function createSubmission(paperId, journalName) {
            const username = prompt('请输入投稿系统用户名:');
            if (!username) return;

            const password = prompt('请输入投稿系统密码:');
            if (!password) return;

            try {
                const res = await fetch(`${API_BASE}/api/submissions/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        paper_id: paperId,
                        journal_name: journalName,
                        username: username,
                        password: password
                    })
                });

                if (!res.ok) throw new Error('创建投稿失败');

                const data = await res.json();
                alert('✅ 投稿创建成功！\n\n投稿ID: ' + data.submission_id + '\n状态: ' + data.status);
                
                // 切换到仪表盘
                document.querySelectorAll('.tab-button')[1].click();

            } catch (error) {
                alert('❌ 创建投稿失败: ' + error.message);
            }
        }

        // 加载仪表盘
        async function loadDashboard() {
            const listDiv = document.getElementById('submissions-list');
            listDiv.innerHTML = '<div class="loading">加载中</div>';

            try {
                const res = await fetch(`${API_BASE}/api/submissions`);
                if (!res.ok) throw new Error('加载失败');

                const data = await res.json();

                // 更新统计
                document.getElementById('total-count').textContent = data.total;
                document.getElementById('pending-count').textContent = 
                    data.submissions.filter(s => s.status === 'pending').length;
                document.getElementById('submitted-count').textContent = 
                    data.submissions.filter(s => s.status === 'submitted').length;

                // 显示投稿列表
                if (data.total === 0) {
                    listDiv.innerHTML = `
                        <div class="empty-state">
                            <p style="font-size: 1.2em;">📭 暂无投稿记录</p>
                            <p>上传论文后即可创建投稿</p>
                        </div>
                    `;
                } else {
                    listDiv.innerHTML = data.submissions.map(sub => `
                        <div class="submission-card">
                            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px;">
                                <div>
                                    <h3 style="color: #667eea; margin-bottom: 5px;">${sub.paper_title}</h3>
                                    <p style="color: #999;">投稿到: ${sub.journal_name}</p>
                                </div>
                                <span class="status-badge status-${sub.status}">${getStatusText(sub.status)}</span>
                            </div>
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; color: #666;">
                                <div><strong>投稿ID:</strong> ${sub.id}</div>
                                <div><strong>创建时间:</strong> ${new Date(sub.created_at).toLocaleString('zh-CN')}</div>
                                <div><strong>更新时间:</strong> ${new Date(sub.updated_at).toLocaleString('zh-CN')}</div>
                            </div>
                        </div>
                    `).join('');
                }

            } catch (error) {
                listDiv.innerHTML = `<div class="error-message">❌ 加载失败: ${error.message}</div>`;
            }
        }

        // 搜索期刊
        async function searchJournals() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) {
                alert('请输入搜索关键词');
                return;
            }

            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = '<div class="loading">搜索中</div>';

            try {
                const res = await fetch(`${API_BASE}/api/journals/search?query=${encodeURIComponent(query)}&top_k=10`);
                if (!res.ok) throw new Error('搜索失败');

                const data = await res.json();

                if (data.total === 0) {
                    resultsDiv.innerHTML = `
                        <div class="empty-state">
                            <p style="font-size: 1.2em;">😕 未找到相关期刊</p>
                            <p>请尝试其他关键词</p>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <p style="margin-bottom: 20px; color: #666;">找到 ${data.total} 个相关期刊</p>
                        ${data.journals.map(journal => `
                            <div class="journal-card">
                                <h3>${journal.name}</h3>
                                <div class="journal-info">
                                    <div class="info-item">
                                        <strong>影响因子:</strong> ${journal.impact_factor}
                                    </div>
                                    <div class="info-item">
                                        <strong>审稿时间:</strong> ${journal.review_time_days} 天
                                    </div>
                                    <div class="info-item">
                                        <strong>接收率:</strong> ${(journal.acceptance_rate * 100).toFixed(1)}%
                                    </div>
                                </div>
                                <p style="margin-top: 10px; color: #666;">
                                    <strong>关键词:</strong> ${journal.keywords.join(', ')}
                                </p>
                                <a href="${journal.url}" target="_blank" class="btn" style="display: inline-block; margin-top: 15px; padding: 10px 20px; font-size: 0.9em; text-decoration: none;">
                                    🔗 访问期刊网站
                                </a>
                            </div>
                        `).join('')}
                    `;
                }

            } catch (error) {
                resultsDiv.innerHTML = `<div class="error-message">❌ 搜索失败: ${error.message}</div>`;
            }
        }

        // 显示消息
        function showMessage(type, message) {
            const msgDiv = document.getElementById('upload-message');
            msgDiv.className = type === 'success' ? 'success-message' : 'error-message';
            msgDiv.textContent = message;
            msgDiv.style.display = 'block';

            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 5000);
        }

        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                'pending': '待处理',
                'submitted': '已提交',
                'under_review': '审稿中',
                'accepted': '已接收',
                'rejected': '已拒稿'
            };
            return statusMap[status] || status;
        }

        // 页面加载完成
        window.addEventListener('load', function() {
            console.log('🚀 PaperSubmit AI 前端已加载');
        });
    </script>
</body>
</html>
